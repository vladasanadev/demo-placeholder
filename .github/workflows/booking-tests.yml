name: Booking regression tests
on:
  pull_request:
    paths:
      - 'examples/booking/**'
      - '.github/workflows/booking-tests.yml'
permissions:
  contents: read
jobs:
  booking-tests:
    name: Booking overlap regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test examples/booking/*.test.mjs
